<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE PIECE: LEGACY — The Coin Lands</title>
<link rel="stylesheet" href="engine/style.css">
</head>
<body>
<div id="theater">
  <div id="stage" tabindex="0">
    <div id="bgA" class="bg"></div><div id="bgB" class="bg"></div>
    <div id="grain"></div>
    <div class="particles" id="particles"></div>
    <div id="cast"></div>
    <div class="speedlines" id="speedlines"></div>
    <div id="sfxlayer"></div>
    <div id="inksplash" class="inksplash">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><path d="M100,10 L118,66 L178,50 L136,96 L190,120 L128,124 L150,182 L100,140 L50,182 L72,124 L10,120 L64,96 L22,50 L82,66 Z" fill="#10131a" opacity=".9"/></svg>
    </div>
    <div id="vignette"></div>
    <div id="flash"></div>
    <div id="hud">
      <div class="hitem">₿ <span class="hval" id="hud-berry">0</span></div>
      <div class="hitem">✚ <span class="hval" id="hud-injury">sound</span></div>
      <div class="hitem">✎ <span class="hval" id="hud-promise">0</span></div>
      <div class="hitem" id="hud-exposure" title="exposure"><span class="exposurepip"></span><span class="exposurepip"></span><span class="exposurepip"></span></div>
      <div class="spacer"></div>
      <div class="hitem hval" id="hud-scene"></div>
      <button id="hud-skip" title="fast-forward already-read text (S)">SKIP</button>
      <button id="hud-log" title="backscroll (L)">LOG</button>
      <button id="hud-drawer" title="campaign drawers (D)">STATE</button>
      <button id="hud-menu" title="menu / saves (ESC)">MENU</button>
    </div>
    <div id="textbox" class="hiddenEl"><span id="nameplate"></span><div id="btext"></div><div id="advhint">▼</div></div>
    <div id="drawer">
      <button id="drawerclose">×</button>
      <div id="drawertabs">
        <button data-tab="state" class="on">CAMPAIGN</button>
        <button data-tab="people">PEOPLE</button>
        <button data-tab="threads">THREADS</button>
        <button data-tab="routes">ROUTES</button>
      </div>
      <div id="drawerbody"></div>
    </div>
    <div id="logwrap" class="hiddenEl"><h3>BACKSCROLL <button id="logclose" style="float:right;background:none;border:1px solid #33404d;color:#93a4b2;border-radius:5px;cursor:pointer">close</button></h3><div id="logbody"></div></div>
    <div id="menuwrap" class="hiddenEl"><div id="menucard"></div></div>
  </div>
</div>
<div id="debugpane"></div>
<script src="../assets/private-overrides/overrides.js" onerror="void 0"></script>
<script src="engine/backgrounds.js"></script>
<script src="engine/portraits.js"></script>
<script src="data/episode1.js"></script>
<script src="data/episode2.js" onerror="void 0"></script>
<script src="data/episode3.js" onerror="void 0"></script>
<script src="engine/game.js"></script>
</body>
</html>
